spring.application.name=back-p1
server.port=${DC_SERVER_PORT}

spring.datasource.url=jdbc:mysql://${DC_DB_HOST}:${DC_DB_PORT}/${DC_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DC_DB_USER}
spring.datasource.password=${DC_DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true